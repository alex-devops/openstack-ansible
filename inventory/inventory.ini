## This inventory contains a base structure,
## a reference for deployers, allowing them
## to extend how they like it.

[all]
localhost ansible_connection=local

[all:vars]
ansible_user=dev
ansible_become=true
otel_collector_endpoint="192.168.20.115:4317"

# hosts is an ansible reserved term.
# We should move away from it, but in between
# we keep this for compatibility reasons.
[physical_hosts:children]
hosts

[hosts]
# --- Controller Nodes (API, DB, MQ Quorum) ---
openstack-control-01 ansible_host=192.168.20.101
openstack-control-02 ansible_host=192.168.20.102
openstack-control-03 ansible_host=192.168.20.103

# --- Compute Nodes (Hypervisors) ---
openstack-compute-01 ansible_host=192.168.20.104
openstack-compute-02 ansible_host=192.168.20.105
openstack-compute-03 ansible_host=192.168.20.106
openstack-compute-04 ansible_host=192.168.20.107
openstack-compute-05 ansible_host=192.168.20.108
openstack-compute-06 ansible_host=192.168.20.109

# --- Storage Nodes (Ceph OSD Hosts) ---
openstack-storage-01 ansible_host=192.168.20.110
openstack-storage-02 ansible_host=192.168.20.111
openstack-storage-03 ansible_host=192.168.20.112

# --- Network Nodes (Neutron L3 Routing) ---
openstack-network-01 ansible_host=192.168.20.113
openstack-network-02 ansible_host=192.168.20.114

# --- Observability Nodes (OTel Collectors & LGTM Stack) ---
otel-collector-01    ansible_host=192.168.20.115
otel-collector-02    ansible_host=192.168.20.116
grafana-lgtm-01      ansible_host=192.168.20.117
grafana-lgtm-02      ansible_host=192.168.20.118
grafana-lgtm-03      ansible_host=192.168.20.119


